version: 1

storage:
  dataDir: data
  snapshotsDir: snapshots
  reportsDir: reports

email:
  enabled: true
  defaultProfile: gmail
  fromEnv: SENTINEL_EMAIL_FROM
  toEnv: SENTINEL_EMAIL_TO
  subjectPrefix: "[Sentinel]"
  profiles:
    gmail:
      host: smtp.gmail.com
      port: 465
      secure: true
      userEnv: SENTINEL_GMAIL_USER
      passEnv: SENTINEL_GMAIL_APP_PASSWORD
      passKeychainService: sentinel-gmail
    icloud:
      host: smtp.mail.me.com
      port: 587
      secure: false
      userEnv: SENTINEL_ICLOUD_USER
      passEnv: SENTINEL_ICLOUD_APP_PASSWORD
      passKeychainService: sentinel-icloud

sites:
  - id: ortix
    name: Ortix
    enabled: true
    sitemapUrls:
      - https://www.ortix.it/sitemap_index.xml
    roots:
      - https://www.ortix.it/
    emailProfile: gmail
    crawl:
      maxDepth: 3
      maxUrls: 500
      timeoutMs: 30000
      userAgent: "Sentinel/0.1 (+https://github.com/max23468/Sentinel)"
    includeFileExtensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - csv
      - zip
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - avif
      - svg
    trackingParams:
      - fbclid
      - gclid
      - msclkid
      - yclid
      - mc_cid
      - mc_eid
      - ref
      - source
    ignoredIssues:
      - status: 404
        urlPattern: "^https://www\\.ortix\\.it/wp-content/uploads/2021/"
        reason: "Asset WordPress storici non rilevanti per il monitor operativo"
      - status: 404
        urlPattern: "^https://www\\.ortix\\.it/\\?p="
        reason: "URL legacy WordPress già noti"
  - id: sancarlo-sviluppo
    name: San Carlo Sviluppo
    enabled: true
    sitemapUrls:
      - https://sancarlosviluppo.com/sitemap_index.xml
    roots:
      - https://sancarlosviluppo.com/
    emailProfile: gmail
  - id: impresa-cogeb
    name: Impresa Cogeb
    enabled: true
    sitemapUrls:
      - https://www.impresacogeb.it/sitemap.xml
    roots:
      # Il sito risponde su entrambi gli host: link interni con www, sitemap senza www.
      # Servono entrambi i root: 7 pagine della sitemap non sono linkate da nessuna pagina.
      - https://www.impresacogeb.it/
      - https://impresacogeb.it/
    emailProfile: gmail
    crawl:
      # I due host raddoppiano gli URL: 345 nella prima scansione, margine sul default 500.
      maxUrls: 800
